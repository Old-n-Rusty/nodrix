name = "nodrix"
main = "worker/src/index.ts"
compatibility_date = "2024-04-01"

[[d1_databases]]
binding = "DB"
database_name = "nodrix_db"
database_id = "2009cbe6-8d11-4896-a824-991a09dd5c57"
migrations_dir = "worker/src/platform/db/migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "nodrix-telemetry"

[[kv_namespaces]]
binding = "NODRIX_KV"
bucket_name = "nodrix_kv"
